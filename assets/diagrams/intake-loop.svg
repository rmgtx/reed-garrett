<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="intakeTitle intakeDesc">
  <title id="intakeTitle">Sessioned vision intake loop</title>
  <desc id="intakeDesc">Capture, vision extract, human confirm, ERP write as a closed session loop.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2A6B66"/>
    </marker>
  </defs>
  <rect width="720" height="220" fill="none"/>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#3A4450">
    <rect x="24" y="70" width="130" height="64" rx="2" fill="#E8EDF2" stroke="#2A6B66" stroke-width="1.5"/>
    <text x="89" y="98" text-anchor="middle" fill="#1A222C" font-size="13">CAPTURE</text>
    <text x="89" y="116" text-anchor="middle">docs + photos</text>

    <line x1="154" y1="102" x2="198" y2="102" stroke="#2A6B66" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="200" y="70" width="130" height="64" rx="2" fill="#E8EDF2" stroke="#2A6B66" stroke-width="1.5"/>
    <text x="265" y="98" text-anchor="middle" fill="#1A222C" font-size="13">VISION</text>
    <text x="265" y="116" text-anchor="middle">structured fields</text>

    <line x1="330" y1="102" x2="374" y2="102" stroke="#2A6B66" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="376" y="70" width="140" height="64" rx="2" fill="#D7E8E6" stroke="#2A6B66" stroke-width="2"/>
    <text x="446" y="98" text-anchor="middle" fill="#1A222C" font-size="13">CONFIRM</text>
    <text x="446" y="116" text-anchor="middle">human gate</text>

    <line x1="516" y1="102" x2="560" y2="102" stroke="#2A6B66" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="562" y="70" width="130" height="64" rx="2" fill="#E8EDF2" stroke="#2A6B66" stroke-width="1.5"/>
    <text x="627" y="98" text-anchor="middle" fill="#1A222C" font-size="13">ERP WRITE</text>
    <text x="627" y="116" text-anchor="middle">tenant contract</text>
  </g>
  <path d="M 627 134 C 627 178 89 178 89 134" fill="none" stroke="#8A4A3A" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#arrow)" opacity="0.85"/>
  <text x="360" y="198" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#8A4A3A" letter-spacing="0.08em">SESSION STATE MACHINE · NOT CHAT</text>
</svg>
