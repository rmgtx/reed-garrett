<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="verdictTitle verdictDesc">
  <title id="verdictTitle">Claim cite verdict pipeline</title>
  <desc id="verdictDesc">Claim extraction flows to citation against a controlled corpus, then to a three-way verdict with method trail.</desc>
  <defs>
    <marker id="vArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2A6B66"/>
    </marker>
  </defs>
  <rect width="720" height="240" fill="none"/>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#3A4450">
    <rect x="40" y="88" width="120" height="56" rx="2" fill="#E8EDF2" stroke="#2A6B66" stroke-width="1.5"/>
    <text x="100" y="114" text-anchor="middle" fill="#1A222C" font-size="13">CLAIM</text>
    <text x="100" y="132" text-anchor="middle">alternate PN</text>

    <line x1="160" y1="116" x2="210" y2="116" stroke="#2A6B66" stroke-width="1.5" marker-end="url(#vArrow)"/>

    <rect x="212" y="88" width="130" height="56" rx="2" fill="#E8EDF2" stroke="#2A6B66" stroke-width="1.5"/>
    <text x="277" y="114" text-anchor="middle" fill="#1A222C" font-size="13">CITE</text>
    <text x="277" y="132" text-anchor="middle">offline corpus</text>

    <line x1="342" y1="116" x2="392" y2="116" stroke="#2A6B66" stroke-width="1.5" marker-end="url(#vArrow)"/>

    <rect x="394" y="40" width="280" height="152" rx="2" fill="#F2F5F8" stroke="#2A6B66" stroke-width="1.5"/>
    <text x="534" y="68" text-anchor="middle" fill="#1A222C" font-size="12" letter-spacing="0.06em">THREE-WAY VERDICT</text>

    <rect x="414" y="84" width="240" height="28" rx="2" fill="#D7E8E6" stroke="#2A6B66"/>
    <text x="534" y="103" text-anchor="middle" fill="#1A222C">confirmed</text>

    <rect x="414" y="120" width="240" height="28" rx="2" fill="#E8EDF2" stroke="#8A4A3A"/>
    <text x="534" y="139" text-anchor="middle" fill="#1A222C">contradicted</text>

    <rect x="414" y="156" width="240" height="28" rx="2" fill="#E8EDF2" stroke="#6B7684" stroke-dasharray="3 2"/>
    <text x="534" y="175" text-anchor="middle" fill="#1A222C">undetermined</text>
  </g>
  <text x="360" y="222" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#6B7684" letter-spacing="0.06em">METHOD TRAIL ON EVERY ROW · UNDETERMINED IS FIRST-CLASS</text>
</svg>
